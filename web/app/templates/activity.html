{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>活動推移</title>
    <link rel="stylesheet" href="{% static 'app/css/index.css' %}">
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1>活動推移</h1>
        </div>
        <div class="header-right">
            <div class="user-info">
                <span>ようこそ、{{ user.username }}さん</span>
                <a href="{% url 'logout' %}" class="logout-btn">ログアウト</a>
            </div>
            <div class="menu-wrap">
                <input type="checkbox" id="menu-toggle" class="menu-toggle">
                <label for="menu-toggle" class="burger" aria-label="メニューを開く">
                    <span></span>
                    <span></span>
                    <span></span>
                </label>
                <nav class="menu-panel">
                    <a href="{% url 'index' %}">ログ一覧</a>
                    <a href="{% url 'activity' %}">活動推移</a>
                    <a href="{% url 'csv' %}">CSVダウンロード</a>
                </nav>
            </div>
        </div>
    </div>

    <div class="content">
        <div class="list-header">
            <h2>日別ログ数</h2>
        </div>

        {% if activity %}
            <table class="log-table">
                <thead>
                    <tr>
                        <th class="col-date">日付</th>
                        <th>件数</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in activity %}
                        <tr>
                            <td class="log-date">{{ row.day }}</td>
                            <td>{{ row.count }}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <p>ログがありません。</p>
        {% endif %}
    </div>
</body>
</html>
